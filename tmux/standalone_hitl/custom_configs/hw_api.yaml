hw_interface_plugin: "mrs_uav_fcu_api::MrsUavFcuApi"

plugin:
  comms_timeout: 1.0          # Example value, adjust if needed
  simulation: true            # True = simulation mode selected

  inputs:
    actuators: false
    control_group: false
    attitude_rate: true
    attitude: true
    acceleration_hdg_rate: false
    acceleration_hdg: false
    velocity_hdg_rate: false
    velocity_hdg: false
    position: false
    feedforward: true

  outputs:
    distance_sensor: true
    gnss: true
    rtk: true
    imu: true
    altitude: true
    magnetometer_heading: true
    magnetic_field: false       # Not in your original, added placeholder
    rc_channels: true
    battery_state: true
    position: true
    orientation: true
    velocity: true
    angular_velocity: true
    odometry: true
    ground_truth: true


  #Generic ID defined by FCU_cm_port
  #----------------------------------
  #need to create file: sudo vim /etc/udev/rules.d/99-mrs-fcu.rules
  #then add rule: SUBSYSTEM=="tty", ATTRS{idVendor}=="0483", ATTRS{idProduct}=="5740", ATTRS{product}=="FCU_com_port", SYMLINK+="mrs_fcu", MODE="0666", ENV{ID_MM_DEVICE_IGNORE}="1"
  #reload riles with: sudo udevadm control --reload-rules, sudo udevadm trigger
  #verify: ls -l /dev/ttyACM*
  #identify available port product: udevadm info -a -n /dev/ttyACM0 | grep 'product'  
  serial_port: '/dev/mrs_fcu'

  #Silicon specific ID
  #---------------------------------
  #serial_port: '/dev/serial/by-id/usb-MRS_FCU_com_port_324F36723431-if00'  # "/dev/ttyUSB0" original for FTDI, other names for USB /dev/ttyACM1 or /dev/ttyACM0

  baud_rate: 2000000  #2000000 original for FTDI, #115200 recomended for native USB

  start_latitude: 15.2
  start_longitude: 14.3