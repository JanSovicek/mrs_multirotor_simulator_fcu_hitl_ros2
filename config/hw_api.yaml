hw_interface_plugin: "mrs_uav_fcu_api::MrsUavFcuApi"

plugin:

  gnss:
    utm_zone: "32T"
    utm_x: 465710.758973
    utm_y: 5249465.43086
    amsl: 340.0

  # determines if offboard can be switched on
  input_timeout: 1.0 # [s]

  input_mode:
    actuators:             true
    control_group:         true
    attitude_rate:         true
    attitude:              true
    acceleration_hdg_rate: true
    acceleration_hdg:      true
    velocity_hdg_rate:     true
    velocity_hdg:          true
    position:              true

    feedforward: true

  outputs:
    distance_sensor:      true
    gnss:                 true
    rtk:                  true
    imu:                  true
    altitude:             true
    magnetometer_heading: true
    rc_channels:          true
    battery_state:        true
    position:             true
    orientation:          true
    velocity:             true
    angular_velocity:     true
    odometry:             true
    ground_truth:         true
